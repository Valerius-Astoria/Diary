spring.application.name=Diary
spring.config.import=optional:classpath:application-local.properties
server.forward-headers-strategy=framework
server.servlet.session.cookie.same-site=lax
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:unused}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:unused}
spring.security.oauth2.client.registration.github.scope=read:user,user:email
