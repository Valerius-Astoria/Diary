<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(${entry.title + ' — Diary'})}"></head>
<body>
<header th:replace="~{layout :: header}"></header>

<main class="container narrow">
    <article class="entry-detail">
        <header class="entry-detail-header">
            <h1 th:text="${entry.title}">Title</h1>
            <p class="meta">
                Entry date:
                <time th:text="${#temporals.format(entry.entryDate, 'MMMM d, yyyy')}">Date</time>
            </p>
            <p class="meta">
                Created <span th:text="${#temporals.format(entry.createdAt, 'MMM d, yyyy HH:mm')}"></span>
                · Updated <span th:text="${#temporals.format(entry.updatedAt, 'MMM d, yyyy HH:mm')}"></span>
            </p>
        </header>

        <div class="entry-content" th:text="${entry.content}">Content</div>

        <div class="actions">
            <a class="button primary" th:href="@{/entries/{id}/edit(id=${entry.id})}">Edit</a>
            <form th:action="@{/entries/{id}/delete(id=${entry.id})}" method="post" class="inline-form"
                  onsubmit="return confirm('Delete this entry permanently?');">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="button danger">Delete</button>
            </form>
            <a class="button secondary" th:href="@{/entries}">Back to list</a>
        </div>
    </article>
</main>
</body>
</html>
