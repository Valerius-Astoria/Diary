<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entries — Diary</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="site-header">
    <div class="container header-inner">
        <a class="brand" th:href="@{/entries}">Diary</a>
        <nav class="nav">
            <a th:href="@{/entries}">Entries</a>
            <a class="button primary small" th:href="@{/entries/new}">New entry</a>
            <form th:action="@{/logout}" method="post" class="inline-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="button secondary small">Sign out</button>
            </form>
        </nav>
    </div>
</header>

<main class="container">
    <div class="page-header">
        <h1>Your diary</h1>
        <a class="button primary" th:href="@{/entries/new}">Write new entry</a>
    </div>

    <section th:if="${page.empty}" class="empty-state">
        <p>No entries yet. Start writing your first diary entry.</p>
        <a class="button primary" th:href="@{/entries/new}">Create entry</a>
    </section>

    <section th:unless="${page.empty}" class="entry-list">
        <article class="entry-card" th:each="entry : ${page.content}">
            <div class="entry-card-header">
                <h2><a th:href="@{/entries/{id}(id=${entry.id})}" th:text="${entry.title}">Title</a></h2>
                <time th:text="${#temporals.format(entry.entryDate, 'MMM d, yyyy')}">Date</time>
            </div>
            <p class="entry-preview" th:text="${#strings.abbreviate(entry.content, 180)}">Preview</p>
            <p class="meta">Last updated <span th:text="${#temporals.format(entry.updatedAt, 'MMM d, yyyy HH:mm')}"></span></p>
        </article>
    </section>
</main>
</body>
</html>
