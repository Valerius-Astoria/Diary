<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Diary — Your private journal')}"></head>
<body>
<header th:replace="~{layout :: header}"></header>

<main class="hero">
    <section class="hero-card">
        <span class="hero-eyebrow">Personal &amp; private</span>
        <h1 class="hero-title">Your private diary</h1>
        <p class="hero-lead">Capture thoughts, reflect on your day, and revisit memories in a secure space that feels like a well-worn journal.</p>
        <div class="actions actions-center actions-spaced">
            <a class="button primary" th:href="@{/login}">Sign in</a>
            <a class="button secondary" th:href="@{/register}">Create account</a>
        </div>
        <p class="hero-quote">“Fill your paper with the breathings of your heart.”</p>
    </section>
</main>
</body>
</html>
