<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Diary</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>
<header class="site-header" th:fragment="header">
    <div class="container header-inner">
        <div class="brand-wrap">
            <a class="brand" th:href="@{/}">Diary</a>
            <span class="brand-tagline" sec:authorize="isAuthenticated()">Your private journal</span>
            <span class="brand-tagline" sec:authorize="!isAuthenticated()">A quiet place for your thoughts</span>
        </div>
        <nav class="nav" sec:authorize="isAuthenticated()">
            <a class="nav-link" th:href="@{/entries}">Entries</a>
            <a class="button primary small" th:href="@{/entries/new}">New entry</a>
            <form th:action="@{/logout}" method="post" class="inline-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="button secondary small">Sign out</button>
            </form>
        </nav>
        <nav class="nav" sec:authorize="!isAuthenticated()">
            <a class="nav-link" th:href="@{/login}">Sign in</a>
            <a class="button primary small" th:href="@{/register}">Create account</a>
        </nav>
    </div>
</header>
</body>
</html>
