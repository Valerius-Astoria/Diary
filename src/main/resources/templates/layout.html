<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Diary</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>
<header class="site-header" th:fragment="header">
    <div class="container header-inner">
        <a class="brand" th:href="@{/entries}">Diary</a>
        <nav class="nav" sec:authorize="isAuthenticated()">
            <a th:href="@{/entries}">Entries</a>
            <a class="button primary small" th:href="@{/entries/new}">New entry</a>
            <form th:action="@{/logout}" method="post" class="inline-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="button secondary small">Sign out</button>
            </form>
        </nav>
    </div>
</header>
</body>
</html>
