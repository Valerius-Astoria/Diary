<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Sign in — Diary')}"></head>
<body>
<header th:replace="~{layout :: header}"></header>

<main class="auth-shell">
    <section class="auth-card">
        <h1>Sign in</h1>
        <p class="lead">Welcome back. Pick up where your last entry left off.</p>

        <p class="notice success" th:if="${param.registered}">Account created. You can sign in now.</p>
        <p class="notice success" th:if="${param.loggedOut}">You have been signed out.</p>
        <p class="notice error" th:if="${param.error}">Invalid email or password.</p>

        <form th:action="@{/login}" method="post" class="form form-plain">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="field">
                <label for="username">Email</label>
                <input id="username" name="username" type="email" autocomplete="username" required>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>
            </div>

            <button type="submit" class="button primary button-block">Sign in</button>
        </form>

        <p class="meta meta-center">No account yet? <a th:href="@{/register}">Register</a></p>
    </section>
</main>
</body>
</html>
