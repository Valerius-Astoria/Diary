<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in — Diary</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="container narrow">
    <h1>Sign in</h1>

    <p class="notice success" th:if="${param.registered}">Account created. You can sign in now.</p>
    <p class="notice success" th:if="${param.loggedOut}">You have been signed out.</p>
    <p class="notice error" th:if="${param.error}">Invalid email or password.</p>

    <form th:action="@{/login}" method="post" class="form">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="field">
            <label for="username">Email</label>
            <input id="username" name="username" type="email" autocomplete="username" required>
        </div>

        <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>

        <button type="submit" class="button primary">Sign in</button>
    </form>

    <p class="meta">No account yet? <a th:href="@{/register}">Register</a></p>
</main>
</body>
</html>
