<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — Diary</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="container narrow">
    <h1>Create account</h1>

    <form th:action="@{/register}" th:object="${registrationForm}" method="post" class="form">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="field">
            <label for="email">Email</label>
            <input id="email" th:field="*{email}" type="email" autocomplete="username">
            <p class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
        </div>

        <div class="field">
            <label for="password">Password</label>
            <input id="password" th:field="*{password}" type="password" autocomplete="new-password">
            <p class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
        </div>

        <button type="submit" class="button primary">Register</button>
    </form>

    <p class="meta">Already have an account? <a th:href="@{/login}">Sign in</a></p>
</main>
</body>
</html>
