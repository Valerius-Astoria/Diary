<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Register — Diary')}"></head>
<body>
<header th:replace="~{layout :: header}"></header>

<main class="auth-shell">
    <section class="auth-card">
        <h1>Create account</h1>
        <p class="lead">Start a private journal you can return to anytime.</p>

        <div th:if="${githubEnabled}" class="oauth-section">
            <a class="button oauth-github button-block" th:href="@{/oauth2/authorization/github}">Continue with GitHub</a>
            <p class="oauth-divider"><span>or register with email</span></p>
        </div>

        <form th:action="@{/register}" th:object="${registrationForm}" method="post" class="form form-plain">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="field">
                <label for="email">Email</label>
                <input id="email" th:field="*{email}" type="email" autocomplete="username">
                <p class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input id="password" th:field="*{password}" type="password" autocomplete="new-password">
                <p class="field-hint">Use at least 8 characters.</p>
                <p class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
            </div>

            <button type="submit" class="button primary button-block">Register</button>
        </form>

        <p class="meta meta-center">Already have an account? <a th:href="@{/login}">Sign in</a></p>
    </section>
</main>
</body>
</html>
